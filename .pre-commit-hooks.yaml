# The hooks norms provides to other projects. prek builds norms from the pinned
# revision with cargo install --locked, installing Rust first if it isn't
# available.

- id: norms-commit-msg
  name: norms commit-msg
  description: Check that a commit message's type is lowercase, its lines are within 72 characters and its breaking change footer is BREAKING-CHANGE
  entry: norms commit-msg
  language: rust
  stages: [commit-msg]

- id: norms-verify
  name: norms verify
  description: Check that the project follows the norms standards
  entry: norms verify .
  language: rust
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
