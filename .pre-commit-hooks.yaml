# The hooks norms provides to other projects. pre-commit builds norms from the
# pinned revision with cargo, installing Rust first if it isn't available.

- id: norms-commit-msg
  name: norms commit-msg
  description: Check that a commit message's type is lowercase and its subject and body lines are within 72 characters
  entry: norms commit-msg
  language: rust
  stages: [commit-msg]

- id: norms-verify
  name: norms verify
  description: Check that the project follows the norms standards
  entry: norms verify .
  language: rust
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
