[package]
name = "norms"
version = "0.1.0"
edition = "2024"
description = "A tool to verify and enforce project coding standards across multiple languages."
repository = "https://github.com/aexoden/norms"
license = "MIT OR Apache-2.0"
keywords = ["coding", "linting", "standards"]
categories = ["development-tools"]

[dependencies]
anyhow = { version = "=1.0.104", features = ["backtrace"] }
clap = { version = "=4.6.7", features = ["derive"] }
colored = "=3.1.1"
json5 = "=1.3.4"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
toml = "=1.1.8"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
