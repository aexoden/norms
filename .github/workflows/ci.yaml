# SPDX-FileCopyrightText: 2026 Jason Lynch <jason@aexoden.com>

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # The template job, and the fixtures job through tests/fixtures.rs, render the template with this
  # Copier.
  # renovate: datasource=pypi depName=copier
  COPIER_VERSION: "9.19.1"

jobs:
  build-norms:
    name: Build norms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Build norms
        run: cargo build --release --locked

      - name: Upload norms
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: norms
          path: target/release/norms
          retention-days: 1

  cargo-deny:
    name: Run cargo-deny check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          arguments: --workspace --all-features
          command: check -D warnings bans licenses sources

  cargo-lock:
    name: Check that Cargo.lock is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Check that Cargo.lock is up to date
        run: cargo update --workspace --locked

  cargo-test:
    name: Run Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version the template pins for rendered projects, which the template job installs too.
      - name: Read the template's cargo-llvm-cov version
        id: versions
        run: echo "cargo-llvm-cov=$(yq '.cargo_llvm_cov_version.default' versions.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@${{ steps.versions.outputs.cargo-llvm-cov }}

      - name: Run Rust tests with coverage
        run: cargo llvm-cov --workspace --all-features --show-missing-lines

  cargo-doctest:
    name: Run Rust doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # cargo-llvm-cov runs doctests only on a nightly toolchain.
      - name: Run Rust doctests
        run: cargo test --workspace --all-features --doc

  ci-success:
    name: CI success
    if: always()
    needs: [build-norms, cargo-deny, cargo-doctest, cargo-lock, cargo-test, clippy, fixtures, markdownlint, norms-verify, prek, reuse, rustfmt, template, tombi, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  clippy:
    name: Lint Rust code with Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Lint Rust code with Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fixtures:
    name: Check the fixtures against fresh renders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Copier clones the checkout to render it, and warns when it's shallow.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Renovate updates the versions the template pins without re-rendering the fixtures, which
      # the snapshots don't see. This fails only when a change the checks see wasn't re-rendered.
      - name: Re-render the language fixtures and compare their snapshots
        env:
          NORMS_RENDER: "1"
        run: cargo test --locked --test fixtures

  markdownlint:
    name: Lint Markdown with markdownlint
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown with markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  norms-verify:
    name: Verify norms with norms
    needs: build-norms
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Without CHANGELOG.md, the changelog check reads the release tags.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download norms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: norms
          path: ${{ runner.temp }}/norms

      - name: Verify norms with norms
        run: |
          chmod +x "$RUNNER_TEMP/norms/norms"
          "$RUNNER_TEMP/norms/norms" verify --deny-warnings .

  prek:
    name: Run the remaining prek hooks and check the commit message
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # A pull request's head commit is the second parent of the merge commit CI checks out.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # norms uses the prek version the template pins.
      - name: Read the template's prek version
        id: versions
        run: echo "prek=$(yq '.prek_version.default' versions.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install prek
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@${{ steps.versions.outputs.prek }}

      # The other hooks have jobs of their own.
      - name: Run the hooks that have no job of their own
        env:
          PREK_SKIP: cargo-deny,cargo-doctest,cargo-lock,cargo-test,clippy,markdownlint-cli2,norms-verify,reuse,rustfmt,tombi-format,zizmor
        run: prek run --all-files --show-diff-on-failure

      # The norms-commit-msg hook runs norms from this checkout with cargo run.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # As in the template's norms-verify job, the commit-msg hooks check the message of the commit
      # CI tests: the one pushed, or a pull request's head commit, unless it's a merge commit, which
      # linear history keeps off main. norms' norms-verify job runs the norms build-norms built
      # rather than its hooks, so they run here. They pass autosquash and merge subjects, which
      # shouldn't reach main, so those are rejected first. The commit is already made, so lines over
      # 72 characters are only a warning. GIT_EDITOR=: tells norms, as git does, that the message
      # wasn't edited, so a line starting with git's comment character is checked as it's recorded.
      - name: Check the commit message
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_EDITOR: ":"
          NORMS_COMMIT_MSG_LENGTH: warn
        run: |
          if [ "$(git cat-file commit "$COMMIT" | sed '/^$/q' | grep -c '^parent ')" -gt 1 ]; then
            echo "The commit is a merge, such as GitHub's Update branch makes, which never reaches main."
            exit 0
          fi
          git log -1 --format=%B "$COMMIT" > "$RUNNER_TEMP/commit-msg.txt"
          case "$(head -n 1 "$RUNNER_TEMP/commit-msg.txt")" in
            'fixup! '* | 'squash! '* | 'amend! '* | Merge*)
              echo "::error::The subject is an autosquash or merge subject, not a conventional commit subject."
              exit 1
              ;;
          esac
          prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/commit-msg.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The hooks run with the template's prek, so this checks that the oldest prek the config
      # allows still reads it, as the template job does for each render.
      - name: Validate the config with its minimum prek
        run: |
          minimum="$(sed -n 's/^minimum_prek_version = "\(.*\)"$/\1/p' prek.toml)"
          if [ -z "$minimum" ]; then
            echo "::error::prek.toml sets no minimum_prek_version."
            exit 1
          fi
          uvx "prek@$minimum" validate-config prek.toml

  reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  rustfmt:
    name: Check Rust code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Check Rust code formatting
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2

  template:
    name: Check the template (${{ matrix.name }})
    needs: build-norms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust application
            answers: "{primary_language: rust}"
          - name: Rust application under MIT alone
            answers: "{primary_language: rust, license: MIT}"
          - name: Rust library
            answers: "{primary_language: rust, project_type: library}"
          - name: Python application
            answers: "{primary_language: python}"
          - name: Python library
            answers: "{primary_language: python, project_type: library}"
          - name: Python library with Rust
            answers: "{primary_language: python, project_type: library, secondary_languages: [rust]}"
          - name: TypeScript application
            answers: "{primary_language: typescript}"
          - name: Rust with a TypeScript frontend
            answers: "{primary_language: rust, secondary_languages: [typescript]}"
          - name: Python with a TypeScript frontend
            answers: "{primary_language: python, secondary_languages: [typescript]}"
          - name: Rust with Python and TypeScript
            answers: "{primary_language: rust, secondary_languages: [python, typescript]}"
          - name: TypeScript with Python and Rust
            answers: "{primary_language: typescript, secondary_languages: [python, rust]}"
    env:
      # renovate: datasource=crate depName=cargo-deny
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Use the same prek, uv, pnpm and cargo-llvm-cov versions the template pins for rendered
      # projects.
      - name: Read the template's tool versions
        id: versions
        run: |
          echo "pnpm=$(yq '.pnpm_version.default' versions.yaml)" >> "$GITHUB_OUTPUT"
          echo "prek=$(yq '.prek_version.default' versions.yaml)" >> "$GITHUB_OUTPUT"
          echo "uv=$(yq '.uv_version.default' versions.yaml)" >> "$GITHUB_OUTPUT"
          echo "cargo-llvm-cov=$(yq '.cargo_llvm_cov_version.default' versions.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@${{ steps.versions.outputs.cargo-llvm-cov }}

      - name: Install prek
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@${{ steps.versions.outputs.prek }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The rendered project's package.json selects the pnpm and Node.js versions it uses.
      - name: Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: ${{ steps.versions.outputs.pnpm }}
          install: false

      - name: Render the template
        env:
          ANSWERS: ${{ matrix.answers }}
        run: |
          printf '%s\n' "$ANSWERS" > "$RUNNER_TEMP/answers.yaml"
          git init "$RUNNER_TEMP/project"
          uvx "copier@$COPIER_VERSION" copy --trust --defaults --vcs-ref HEAD \
            --data-file "$RUNNER_TEMP/answers.yaml" \
            --data project_name=demo-project --data "description=A demonstration project." \
            . "$RUNNER_TEMP/project"
          git -C "$RUNNER_TEMP/project" add --all
          # prek clones the norms repository to read its norms-commit-msg hook's stage, and a
          # release commit pins its own tag, which isn't pushed until CI passes, so the hooks run
          # from a copy of the config whose norms hooks come from this checkout. The project keeps
          # the config as rendered, for norms verify.
          sed \
            -e "s|^repo = \"https://github.com/aexoden/norms\"\$|repo = \"$GITHUB_WORKSPACE\"|" \
            -e "\|^repo = \"$GITHUB_WORKSPACE\"\$|{n;s|^rev = .*|rev = \"$(git rev-parse HEAD)\"|}" \
            "$RUNNER_TEMP/project/prek.toml" > "$RUNNER_TEMP/prek.toml"
          if cmp -s "$RUNNER_TEMP/project/prek.toml" "$RUNNER_TEMP/prek.toml"; then
            echo "::error::The render's norms repository wasn't replaced with this checkout."
            exit 1
          fi

      # The hooks run with the latest prek, so this checks that the oldest prek the config allows
      # still reads it, catching a feature such as a builtin hook added after that version.
      - name: Validate the rendered config with its minimum prek
        working-directory: ${{ runner.temp }}/project
        run: |
          minimum="$(sed -n 's/^minimum_prek_version = "\(.*\)"$/\1/p' prek.toml)"
          if [ -z "$minimum" ]; then
            echo "::error::The render's prek.toml sets no minimum_prek_version."
            exit 1
          fi
          uvx "prek@$minimum" validate-config prek.toml

      # The norms-verify hook would build norms, so the step below verifies the project with the
      # build-norms job's build instead.
      - name: Run the rendered project's hooks
        working-directory: ${{ runner.temp }}/project
        env:
          PREK_SKIP: norms-verify
        run: prek run --config "$RUNNER_TEMP/prek.toml" --all-files --show-diff-on-failure

      # The first run built what the hooks build, such as vite-build's dist/, which a hook that
      # doesn't ignore it fails on from the next run on.
      - name: Run the rendered project's hooks again
        working-directory: ${{ runner.temp }}/project
        env:
          PREK_SKIP: norms-verify
        run: prek run --config "$RUNNER_TEMP/prek.toml" --all-files --show-diff-on-failure

      - name: Download norms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: norms
          path: ${{ runner.temp }}/norms

      - name: Verify the rendered project with norms
        run: |
          chmod +x "$RUNNER_TEMP/norms/norms"
          "$RUNNER_TEMP/norms/norms" verify --deny-warnings "$RUNNER_TEMP/project"

      # A Rust application's build.rs and a TypeScript application's vite.config.ts set the version
      # it reports from git describe. This commits and tags the render, so it comes after norms
      # verify, which would expect the tag in CHANGELOG.md.
      - name: Check the versions the rendered applications report
        working-directory: ${{ runner.temp }}/project
        shell: bash
        run: |
          # Found by files that don't depend on the version code, so that a component missing it fails.
          mapfile -t rust < <(git ls-files ':(glob)**/src/main.rs' | sed -E 's#(^|/)src/main.rs$##; s#^$#.#')
          mapfile -t typescript < <(git ls-files ':(glob)**/package.json' | xargs -r -n 1 dirname)
          check() {
            local dir version
            for dir in "${rust[@]}"; do
              version=$(cd "$dir" && cargo run --quiet --locked -- --version | cut -d ' ' -f 2)
              if [ "$version" != "$1" ]; then
                echo "::error::$dir: the Rust application reports $version, not $1"
                exit 1
              fi
            done
            for dir in "${typescript[@]}"; do
              (cd "$dir" && pnpm exec vite build --logLevel warn)
              if ! grep -rqF -e "version=\"$1\"" -e "version='$1'" -e "version=\`$1\`" "$dir/dist"; then
                echo "::error::$dir: the Vite build doesn't contain the version $1"
                exit 1
              fi
            done
          }
          commit() {
            git -c user.name=CI -c user.email=ci@example.com commit --quiet --no-verify "$@"
          }
          # Without git. The hooks already ran the build script with git, which Cargo wouldn't rerun
          # for a change in GIT_DIR, so this builds in a target directory of its own.
          (export GIT_DIR=/nonexistent CARGO_TARGET_DIR="$RUNNER_TEMP/no-git"; check 0.0.0)
          commit --message "chore: render the template"
          check "0.0.0+g$(git rev-parse --short HEAD)"
          git tag v0.1.0
          check 0.1.0
          commit --allow-empty --message "chore: commit past the release"
          check "0.1.0-1-g$(git rev-parse --short HEAD)"
          # The build script reruns when src/ changes, but not for every file.
          for dir in "${rust[@]}"; do echo "// A change." >> "$dir/src/main.rs"; done
          for dir in "${typescript[@]}"; do echo "// A change." >> "$dir/src/main.ts"; done
          check "0.1.0-1-g$(git rev-parse --short HEAD)-dirty"

  tombi:
    name: Check TOML formatting with Tombi
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@8ddc6b91b6fa3ad0ce192a68b409930851e4886c # v1.11.2
        with:
          enable-cache: false

      - name: Check TOML formatting with Tombi
        run: tombi format --check --diagnostics-format github

  zizmor:
    name: GitHub Actions security analysis with zizmor 🌈
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
