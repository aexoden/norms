# Pre-commit configuration
# Install: pre-commit install
# Update: pre-commit autoupdate

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        # copier.yml uses Copier's !include tag across several documents.
        exclude: ^copier\.yml$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Licensing
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # Markdown
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions security
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: ["--pedantic"]

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, style, test, docs, build, ci, revert, chore]

  # Rust
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        description: Format Rust code using rustfmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Lint Rust code using clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        description: Run Rust tests using cargo test
        entry: cargo test --workspace --all-features
        language: system
        pass_filenames: false
      - id: cargo-deny
        name: cargo-deny
        description: Check Rust dependency bans, licenses and sources using cargo-deny
        entry: cargo deny check bans licenses sources
        language: system
        pass_filenames: false
