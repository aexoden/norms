# Pre-commit configuration
# Install: pre-commit install

default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own stages run only before a commit, not on its message.
default_stages: [pre-commit]

# The test fixtures are projects for norms to check, kept exactly as written.
exclude: ^tests/fixtures/

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        # copier.yml uses Copier's !include tag across several documents.
        exclude: ^copier\.yml$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Licensing
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse

  # Markdown
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # TOML
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.10.0
    hooks:
      - id: tombi-format
        args: [--check]
        # Lock files are generated, so they aren't formatted.
        exclude: (^|/)(Cargo|uv)\.lock$

  # GitHub Actions security
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: ["--pedantic"]

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, style, test, docs, build, ci, revert, chore]

  # norms, run from this checkout; other projects use the hooks in
  # .pre-commit-hooks.yaml instead.
  - repo: local
    hooks:
      - id: norms-commit-msg
        name: norms commit-msg
        description: Check that a commit message's subject and body lines are within 72 characters
        entry: cargo run --quiet --locked -- commit-msg
        language: unsupported
        stages: [commit-msg]
      - id: norms-verify
        name: norms verify
        description: Check that the project follows the norms standards
        entry: cargo run --quiet --locked -- verify .
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        args: [--deny-warnings]

  # Rust
  - repo: local
    hooks:
      - id: cargo-lock
        name: cargo lock
        description: Check that Cargo.lock is up to date
        entry: cargo update --workspace --locked
        language: unsupported
        pass_filenames: false
      - id: rustfmt
        name: rustfmt
        description: Format Rust code using rustfmt
        entry: cargo fmt --all --check
        language: unsupported
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Lint Rust code using clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: unsupported
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        description: Run Rust tests using cargo test
        entry: cargo test --workspace --all-features
        language: unsupported
        pass_filenames: false
      - id: cargo-deny
        name: cargo-deny
        description: Check Rust dependency bans, licenses and sources using cargo-deny
        entry: cargo deny --workspace --all-features check -D warnings bans licenses sources
        language: unsupported
        pass_filenames: false
