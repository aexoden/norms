# Every tool, action, hook and dependency version used by the Copier template.
# Each entry is a hidden Copier variable. Renovate keeps them current through
# the custom manager in renovate.json, which reads the comment above each one.
# Actions are pinned as "<sha> # <version>".

# Toolchains

# renovate: datasource=github-tags depName=rust packageName=rust-lang/rust
rust_toolchain:
  default: "1.99.1"
  when: false

# renovate: datasource=python-version depName=python
python_version:
  default: "3.15.1"
  when: false

# renovate: datasource=pypi depName=uv
uv_version:
  default: "0.13.6"
  when: false

# renovate: datasource=node-version depName=node
node_version:
  default: "26.12.1"
  when: false

# renovate: datasource=npm depName=pnpm
pnpm_version:
  default: "12.15.0"
  when: false

# pre-commit hooks

# renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
hook_pre_commit_hooks:
