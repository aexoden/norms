# Every tool, action, hook and dependency version used by the Copier template.
# Each entry is a hidden Copier variable. Renovate keeps them current through
# the custom managers in renovate.json, which read the comment above each one.
# Actions are pinned as "<sha> # <version>".

# Toolchains

# renovate: datasource=rust-version depName=rust
rust_toolchain:
  default: "1.100.0"
  when: false

# renovate: datasource=python-version depName=python
python_version:
  default: "3.15.2"
  when: false

# renovate: datasource=pypi depName=uv
uv_version:
  default: "0.13.9"
  when: false

# renovate: datasource=node-version depName=node
node_version:
  default: "26.13.1"
  when: false

# renovate: datasource=npm depName=pnpm
pnpm_version:
  default: "12.22.0"
  when: false

# cargo-llvm-cov, which the cargo-test hook and job run, installed in CI by
# taiki-e/install-action

# renovate: datasource=crate depName=cargo-llvm-cov
cargo_llvm_cov_version:
  default: "0.9.1"
  when: false

# prek, which CI installs with taiki-e/install-action to run the hooks

# renovate: datasource=pypi depName=prek
prek_version:
  default: "0.5.11"
  when: false

# Hooks

# renovate: datasource=github-tags depName=fsfe/reuse-tool
hook_reuse:
  default: "v6.3.0"
  when: false

# renovate: datasource=github-tags depName=DavidAnson/markdownlint-cli2
hook_markdownlint_cli2:
  default: "v0.24.1"
  when: false

# renovate: datasource=github-tags depName=tombi-toml/tombi-pre-commit
hook_tombi:
  default: "v1.11.3"
  when: false

# renovate: datasource=github-tags depName=zizmorcore/zizmor-pre-commit
hook_zizmor:
  default: "v1.32.0"
  when: false

# renovate: datasource=github-tags depName=compilerla/conventional-pre-commit
hook_conventional_pre_commit:
  default: "v4.5.0"
  when: false

# norms' own hooks. A release sets this to the version it tags, so that a project
# rendered from it runs the norms that checked the template.
# renovate: datasource=github-tags depName=aexoden/norms
hook_norms:
  default: "v0.3.0"
  when: false

