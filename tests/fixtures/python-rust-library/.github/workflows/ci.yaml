name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Tools CI installs or runs at a pinned version, which Renovate updates from the
# comment above each one.
env:
  # renovate: datasource=pypi depName=prek
  PREK_VERSION: "0.5.11"
  # renovate: datasource=crate depName=cargo-llvm-cov
  CARGO_LLVM_COV_VERSION: "0.9.1"

jobs:
  markdownlint:
    name: Lint Markdown with markdownlint
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown with markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  norms-verify:
    name: Verify the project and the commit message
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Without CHANGELOG.md, norms reads the release tags.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install prek
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@${{ env.PREK_VERSION }}

      # prek builds norms and installs the commit-msg hooks again only when prek or prek.toml changes.
      - name: Cache prek's hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prek-${{ runner.os }}-${{ env.PREK_VERSION }}-${{ hashFiles('prek.toml') }}
          path: ~/.cache/prek

      # prek builds norms at the revision prek.toml pins.
      - name: Verify the project with norms
        run: prek run norms-verify --all-files

      # The commit-msg hooks check the message of the commit CI tests: the one pushed, or a pull
      # request's head commit, unless it's a merge commit, which linear history keeps off main. They
      # pass autosquash and merge subjects, which shouldn't reach main, so those are rejected first.
      # The commit is already made, so lines over 72 characters are only a warning. GIT_EDITOR=:
      # tells norms, as git does, that the message wasn't edited, so a line starting with git's
      # comment character is checked as it's recorded.
      - name: Check the commit message
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_EDITOR: ":"
          NORMS_COMMIT_MSG_LENGTH: warn
        run: |
          if [ "$(git cat-file commit "$COMMIT" | sed '/^$/q' | grep -c '^parent ')" -gt 1 ]; then
            echo "The commit is a merge, such as GitHub's Update branch makes, which never reaches main."
            exit 0
          fi
          git log -1 --format=%B "$COMMIT" > "$RUNNER_TEMP/commit-msg.txt"
          case "$(head -n 1 "$RUNNER_TEMP/commit-msg.txt")" in
            'fixup! '* | 'squash! '* | 'amend! '* | Merge*)
              echo "::error::The subject is an autosquash or merge subject, not a conventional commit subject."
              exit 1
              ;;
          esac
          prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/commit-msg.txt"

  prek:
    name: Run the remaining prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install prek
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@${{ env.PREK_VERSION }}

      - name: Run the hooks that have no job of their own
        env:
          PREK_SKIP: basedpyright,cargo-deny,cargo-doctest,cargo-lock,cargo-test,clippy,markdownlint-cli2,mypy,norms-verify,pytest,reuse,ruff-check,ruff-format,rustfmt,tombi-format,uv-lock,zizmor
        run: prek run --all-files --show-diff-on-failure

  reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  tombi:
    name: Check TOML formatting with Tombi
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@7417bd6e820cf0d4f89d77b48d13ba5d060435bf # v1.11.3
        with:
          enable-cache: false

      - name: Check TOML formatting with Tombi
        run: tombi format --check --diagnostics-format github

  zizmor:
    name: GitHub Actions security analysis with zizmor 🌈
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          strict-collection: true

  cargo-deny:
    name: Run cargo-deny check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          arguments: --workspace --all-features
          command: check -D warnings bans licenses sources
          manifest-path: rust/Cargo.toml

  cargo-lock:
    name: Check that Cargo.lock is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Check that Cargo.lock is up to date
        run: cargo update --workspace --locked

  cargo-test:
    name: Run Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: rust -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Run Rust tests with coverage
        run: cargo llvm-cov --workspace --all-features --show-missing-lines

  cargo-doctest:
    name: Run Rust doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: rust -> target

      # cargo-llvm-cov runs doctests only on a nightly toolchain.
      - name: Run Rust doctests
        run: cargo test --workspace --all-features --doc

  clippy:
    name: Lint Rust code with Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: rust -> target

      - name: Lint Rust code with Clippy
        run: cargo clippy --workspace --all-targets --all-features --config 'build.warnings="deny"'

  msrv:
    name: Check the minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: rust -> target
          toolchain: "1.100"

      # Development dependencies may need a newer Rust, so only the library is checked.
      - name: Check the library with the minimum supported Rust version
        run: cargo check --workspace --all-features --locked

  rustfmt:
    name: Check Rust code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Check Rust code formatting
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
        with:
          manifest-path: rust/Cargo.toml

  basedpyright:
    name: Type check Python code with basedpyright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          require-checksums: true
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check Python code with basedpyright
        run: uv run basedpyright

  mypy:
    name: Type check Python code with mypy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          require-checksums: true
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check Python code with mypy
        run: uv run mypy .

  pytest:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          require-checksums: true
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: uv run pytest --cov=src/demo_library --cov-report=term-missing

  pytest-min-python:
    name: Run Python tests on the oldest supported Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          require-checksums: true
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: uv run pytest --cov=src/demo_library --cov-report=term-missing

  ruff-check:
    name: Lint Python code with Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          require-checksums: true
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint Python code with Ruff
        run: uv run ruff check

  ruff-format:
    name: Check Python code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          require-checksums: true
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python code formatting
        run: uv run ruff format --check

  uv-lock:
    name: Check that uv.lock is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The jobs share setup-uv's cache, which this one would save without the packages they install.
          enable-cache: false
          require-checksums: true
          version: "0.13.9"

      - name: Check that uv.lock is up to date
        run: uv lock --check

  # The gate, which the ruleset requires, after the jobs it needs.
  ci-success:
    name: CI success
    if: always()
    needs: [basedpyright, cargo-deny, cargo-doctest, cargo-lock, cargo-test, clippy, markdownlint, msrv, mypy, norms-verify, prek, pytest, pytest-min-python, reuse, ruff-check, ruff-format, rustfmt, tombi, uv-lock, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
