default_install_hook_types = ["commit-msg", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos]]
rev = "v6.2.0"
repo = "https://github.com/fsfe/reuse-tool"

[[repos.hooks]]
id = "reuse"
stages = ["pre-push"]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.10.0"

[[repos.hooks]]
id = "tombi-format"
stages = ["manual"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0"

[[repos.hooks]]
id = "ruff-check"
alias = "ruff-check-api"
files = "^api/"

[[repos.hooks]]
id = "ruff-check"
alias = "ruff-check-worker"
files = "^worker/"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["pre-commit"]
args = ["--strict", "feat", "fix", "docs", "chore", "wip"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "eslint"
alias = "eslint-admin"
name = "eslint (admin)"
entry = "pnpm --dir admin exec eslint . --max-warnings 0"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "eslint"
name = "eslint (web)"
entry = "pnpm --dir web exec eslint . --max-warnings 0"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "vitest"
entry = "pnpm --dir web exec vitest run"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "test"
alias = "vitest"
entry = "pnpm --dir admin exec vitest run"
language = "system"
pass_filenames = false

[[repos]]
repo = "https://github.com/aexoden/norms"
rev = "v0.2.0"

[[repos.hooks]]
id = "norms-commit-msg"
stages = ["pre-commit"]

[[repos.hooks]]
id = "norms-verify"
