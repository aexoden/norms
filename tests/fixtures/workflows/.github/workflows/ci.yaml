name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions: {}

jobs:
  zizmor-run:
    name: Run zizmor
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Run zizmor without a persona
        run: uvx zizmor .

  zizmor-action:
    name: Run zizmor-action
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 10
    steps:
      - name: Run zizmor-action in its default mode
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          persona: pedantic

  norms-verify:
    name: Verify the project with norms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository without the release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the project with norms
        run: uvx pre-commit@4.7.0 run norms-verify --all-files

  ci-success:
    name: CI success
    needs: zizmor-run
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
      - name: Report other results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: echo "A job didn't succeed"
