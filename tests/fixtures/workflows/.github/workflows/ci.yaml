name: CI

on:
  pull_request:

permissions: {}

jobs:
  zizmor-run:
    name: Run zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Run zizmor without a persona
        run: uvx zizmor .

  zizmor-action:
    name: Run zizmor-action
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Run zizmor-action in its default mode
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          persona: pedantic

  ci-success:
    name: CI success
    needs: zizmor-run
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
      - name: Report other results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: echo "A job didn't succeed"
