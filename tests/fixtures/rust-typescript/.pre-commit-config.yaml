# Pre-commit configuration
# Install: pre-commit install

default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own stages run only before a commit, not on its message.
default_stages: [pre-commit]

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        # pnpm-lock.yaml holds more than one document.
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Licensing
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse

  # Markdown
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions security
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: ["--pedantic"]

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, style, test, docs, build, ci, revert, chore]

  # Rust
  - repo: local
    hooks:
      - id: cargo-lock
        name: cargo lock
        description: Check that Cargo.lock is up to date
        entry: cargo update --workspace --locked
        language: system
        pass_filenames: false
      - id: rustfmt
        name: rustfmt
        description: Format Rust code using rustfmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Lint Rust code using clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        description: Run Rust tests using cargo test
        entry: cargo test --workspace --all-features
        language: system
        pass_filenames: false
      - id: cargo-deny
        name: cargo-deny
        description: Check Rust dependency bans, licenses and sources using cargo-deny
        entry: cargo deny --workspace --all-features check -D warnings bans licenses sources
        language: system
        pass_filenames: false

  # TypeScript
  - repo: local
    hooks:
      - id: pnpm-lock
        name: pnpm lock
        description: Check that pnpm-lock.yaml is up to date
        entry: pnpm --dir frontend exec pnpm install --frozen-lockfile
        language: system
        pass_filenames: false
      - id: pnpm-peer-dependencies
        name: pnpm peer dependencies
        description: Check for missing or invalid peer dependencies
        entry: pnpm --dir frontend exec pnpm peers check
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        description: Check formatting using Prettier
        entry: pnpm --dir frontend exec prettier --check .
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint
        description: Lint TypeScript code using ESLint
        entry: pnpm --dir frontend exec eslint . --max-warnings 0
        language: system
        pass_filenames: false
      - id: tsc
        name: tsc
        description: Type check TypeScript code using tsc
        entry: pnpm --dir frontend exec tsc -b --noEmit
        language: system
        pass_filenames: false
      - id: vite-build
        name: vite build
        description: Build the TypeScript application using Vite
        entry: pnpm --dir frontend exec vite build
        language: system
        pass_filenames: false
      - id: vitest
        name: vitest
        description: Run TypeScript tests using Vitest
        entry: pnpm --dir frontend exec vitest run
        language: system
        pass_filenames: false
