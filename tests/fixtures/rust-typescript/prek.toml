# prek configuration
# Install: prek install

# The oldest prek that runs this configuration, which priority aliases need.
# Raise it only when the configuration needs a newer prek.
minimum_prek_version = "0.4.11"

default_install_hook_types = ["pre-commit", "commit-msg"]
# Hooks without their own stages run only before a commit, not on its message.
default_stages = ["pre-commit"]

# Hooks of one priority run together, and lower priorities first. The lock
# checks finish before the other hooks, since pnpm install may rewrite
# node_modules, and hooks without a priority, such as the builtin hooks, run
# before both in their own order.
[priorities]
lock = 100
check = 200

# General hooks, built into prek
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-vcs-permalinks"

[[repos.hooks]]
id = "check-yaml"
# pnpm-lock.yaml holds more than one document.
args = ["--allow-multiple-documents"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"

# Licensing
[[repos]]
repo = "https://github.com/fsfe/reuse-tool"
rev = "v6.3.0"

# No priority, so reuse runs alone before the hooks that write ignored files:
# it lists the ignored files once, then counts any created later as unlicensed.
[[repos.hooks]]
id = "reuse"

# Markdown
[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.24.1"

[[repos.hooks]]
id = "markdownlint-cli2"
priority = "check"

# TOML
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.11.3"

[[repos.hooks]]
id = "tombi-format"
args = ["--check"]
# Lock files are generated, so they aren't formatted.
exclude = '(^|/)(Cargo|uv)\.lock$'
priority = "check"

# GitHub Actions security
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.32.0"

[[repos.hooks]]
id = "zizmor"
args = ["--pedantic"]
priority = "check"

# Conventional commits
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["feat", "fix", "perf", "refactor", "style", "test", "docs", "build", "ci", "revert", "chore"]

# norms: commit messages, and the project against the standards
[[repos]]
repo = "https://github.com/aexoden/norms"
rev = "v0.3.0"

[[repos.hooks]]
id = "norms-commit-msg"

[[repos.hooks]]
id = "norms-verify"
args = ["--deny-warnings"]
priority = "check"

# Rust
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-lock"
name = "cargo lock"
description = "Check that Cargo.lock is up to date"
entry = "cargo update --workspace --locked"
language = "system"
pass_filenames = false
priority = "lock"

[[repos.hooks]]
id = "rustfmt"
name = "rustfmt"
description = "Format Rust code using rustfmt"
entry = "cargo fmt --all --check"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "clippy"
name = "clippy"
description = "Lint Rust code using clippy"
entry = "cargo clippy --workspace --all-targets --all-features --config 'build.warnings=\"deny\"'"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "cargo-test"
name = "cargo llvm-cov"
description = "Run Rust tests with coverage using cargo-llvm-cov"
entry = "cargo llvm-cov --workspace --all-features --show-missing-lines"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "cargo-deny"
name = "cargo-deny"
description = "Check Rust dependency bans, licenses and sources using cargo-deny"
entry = "cargo deny --workspace --all-features check -D warnings bans licenses sources"
language = "system"
pass_filenames = false
priority = "check"

# TypeScript
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pnpm-lock"
name = "pnpm lock"
description = "Check that pnpm-lock.yaml is up to date"
entry = "pnpm --dir frontend exec pnpm install --frozen-lockfile"
language = "system"
pass_filenames = false
priority = "lock"

[[repos.hooks]]
id = "pnpm-peer-dependencies"
name = "pnpm peer dependencies"
description = "Check for missing or invalid peer dependencies"
entry = "pnpm --dir frontend exec pnpm peers check"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "prettier"
name = "prettier"
description = "Check formatting using Prettier"
entry = "pnpm --dir frontend exec prettier --check ."
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "eslint"
name = "eslint"
description = "Lint TypeScript code using ESLint"
entry = "pnpm --dir frontend exec eslint . --max-warnings 0"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "tsc"
name = "tsc"
description = "Type check TypeScript code using tsc"
entry = "pnpm --dir frontend exec tsc -b --noEmit"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "vite-build"
name = "vite build"
description = "Build the TypeScript application using Vite"
entry = "pnpm --dir frontend exec vite build"
language = "system"
pass_filenames = false
priority = "check"

[[repos.hooks]]
id = "vitest"
name = "vitest"
description = "Run TypeScript tests using Vitest"
entry = "pnpm --dir frontend exec vitest run --coverage"
language = "system"
pass_filenames = false
priority = "check"
