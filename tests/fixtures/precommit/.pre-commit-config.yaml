default_install_hook_types: [commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        stages: [pre-push]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        alias: ruff-check-api
        files: ^api/
      - id: ruff-check
        alias: ruff-check-worker
        files: ^worker/
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [pre-commit]
        args: [--strict, feat, fix, docs, chore, wip]
  - repo: local
    hooks:
      - id: eslint
        alias: eslint-admin
        name: eslint (admin)
        entry: pnpm --dir admin exec eslint . --max-warnings 0
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: pnpm --dir web exec eslint . --max-warnings 0
        language: system
        pass_filenames: false
      - id: vitest
        entry: pnpm --dir web exec vitest run
        language: system
        pass_filenames: false
      - id: test
        alias: vitest
        entry: pnpm --dir admin exec vitest run
        language: system
        pass_filenames: false
