name: CI
on: [push]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Run pre-commit, skipping reuse
        env:
          SKIP: reuse
        run: uvx pre-commit run --all-files
  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Lint only some files
        run: uvx reuse lint-file README.md
