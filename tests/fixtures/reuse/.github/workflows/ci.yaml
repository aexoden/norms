name: CI
on: [push]
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Run prek, skipping reuse
        env:
          PREK_SKIP: reuse
        run: uvx prek run --all-files
  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Lint only some files
        run: uvx reuse lint-file README.md
