name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Tools CI installs or runs at a pinned version, which Renovate updates from the
# comment above each one.
env:
  # renovate: datasource=pypi depName=prek
  PREK_VERSION: "0.5.11"

jobs:
  markdownlint:
    name: Lint Markdown with markdownlint
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown with markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  norms-verify:
    name: Verify the project and the commit message
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Without CHANGELOG.md, norms reads the release tags.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install prek
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@${{ env.PREK_VERSION }}

      # prek builds norms at the revision prek.toml pins.
      - name: Verify the project with norms
        run: prek run norms-verify --all-files

      # The commit-msg hooks check the message of the commit CI tests: the one pushed, or a pull
      # request's head commit, unless it's a merge commit, which linear history keeps off main. They
      # pass autosquash and merge subjects, which shouldn't reach main, so those are rejected first.
      # The commit is already made, so lines over 72 characters are only a warning. GIT_EDITOR=:
      # tells norms, as git does, that the message wasn't edited, so a line starting with git's
      # comment character is checked as it's recorded.
      - name: Check the commit message
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_EDITOR: ":"
          NORMS_COMMIT_MSG_LENGTH: warn
        run: |
          if [ "$(git cat-file commit "$COMMIT" | sed '/^$/q' | grep -c '^parent ')" -gt 1 ]; then
            echo "The commit is a merge, such as GitHub's Update branch makes, which never reaches main."
            exit 0
          fi
          git log -1 --format=%B "$COMMIT" > "$RUNNER_TEMP/commit-msg.txt"
          case "$(head -n 1 "$RUNNER_TEMP/commit-msg.txt")" in
            'fixup! '* | 'squash! '* | 'amend! '* | Merge*)
              echo "::error::The subject is an autosquash or merge subject, not a conventional commit subject."
              exit 1
              ;;
          esac
          prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/commit-msg.txt"

  prek:
    name: Run the remaining prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install prek
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@${{ env.PREK_VERSION }}

      - name: Run the hooks that have no job of their own
        env:
          PREK_SKIP: eslint,markdownlint-cli2,norms-verify,pnpm-lock,pnpm-peer-dependencies,prettier,reuse,tombi-format,tsc,vite-build,vitest,zizmor
        run: prek run --all-files --show-diff-on-failure

  reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  tombi:
    name: Check TOML formatting with Tombi
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@7417bd6e820cf0d4f89d77b48d13ba5d060435bf # v1.11.3
        with:
          enable-cache: false

      - name: Check TOML formatting with Tombi
        run: tombi format --check --diagnostics-format github

  zizmor:
    name: GitHub Actions security analysis with zizmor 🌈
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic

  eslint:
    name: Lint TypeScript code with ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0

      - name: Lint TypeScript code with ESLint
        run: pnpm exec eslint . --max-warnings 0

  pnpm-peer-dependencies:
    name: Check pnpm peer dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0

      - name: Check pnpm peer dependencies
        run: pnpm peers check

  prettier:
    name: Check TypeScript code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0

      - name: Check formatting with Prettier
        run: pnpm exec prettier --check .

  tsc:
    name: Type check TypeScript code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0

      - name: Type check TypeScript code
        run: pnpm exec tsc -b --noEmit

  vite-build:
    name: Build the TypeScript application with Vite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0

      - name: Build the TypeScript application with Vite
        run: pnpm exec vite build

  vitest:
    name: Run TypeScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0

      - name: Run TypeScript tests
        run: pnpm exec vitest run --coverage

  # The gate, which the ruleset requires, after the jobs it needs.
  ci-success:
    name: CI success
    if: always()
    needs: [eslint, markdownlint, norms-verify, pnpm-peer-dependencies, prek, prettier, reuse, tombi, tsc, vite-build, vitest, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
