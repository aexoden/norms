repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv --directory . lock --check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest --cov-report=term-missing
        language: system
        pass_filenames: false
      - id: pnpm-peer-dependencies
        name: pnpm peer dependencies
        entry: pnpm --dir . exec pnpm peers check
        language: system
        pass_filenames: false
      - id: vitest
        name: vitest
        entry: pnpm exec vitest run
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm exec eslint . --max-warnings 10
        language: system
        pass_filenames: false
