repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv --directory . lock --check
        language: unsupported
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest --cov-report=term-missing
        language: unsupported
        pass_filenames: false
      - id: pnpm-peer-dependencies
        name: pnpm peer dependencies
        entry: pnpm --dir . exec pnpm peers check
        language: unsupported
        pass_filenames: false
      - id: vitest
        name: vitest
        entry: pnpm exec vitest run
        language: unsupported
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm exec eslint . --max-warnings 10
        language: unsupported
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --diff
        language: unsupported
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write .
        language: unsupported
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: pnpm exec tsc -b --noEmit
        language: unsupported
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
