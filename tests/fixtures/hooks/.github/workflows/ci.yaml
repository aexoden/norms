name: CI

on:
  pull_request:

permissions: {}

jobs:
  pre-commit:
    name: Run the remaining hooks, skipping only some of those with jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          SKIP: uv-lock,pnpm-peer-dependencies,vitest
        run: uvx pre-commit@4.3.0 run --all-files

  uv-lock:
    name: Check uv.lock with lock's older --locked flag
    runs-on: ubuntu-latest
    steps:
      - run: uv --directory . lock --locked

  ruff-check:
    name: Sync without checking the lock file
    runs-on: ubuntu-latest
    steps:
      - run: uv sync --frozen
      - run: uv run ruff check

  ruff-format:
    name: Sync with --locked first
    runs-on: ubuntu-latest
    steps:
      - run: uv sync --locked
      - run: uv run ruff format --check

  mypy:
    name: Run with --locked
    runs-on: ubuntu-latest
    steps:
      - run: uv run --locked mypy .

  pytest:
    name: Sync with --locked too late
    runs-on: ubuntu-latest
    steps:
      - run: uv run pytest
      - run: uv sync --locked

  pnpm-peer-dependencies:
    name: Check peer dependencies through exec
    runs-on: ubuntu-latest
    steps:
      - run: pnpm --dir . exec pnpm peers check

  eslint:
    name: Lint through the lint script
    runs-on: ubuntu-latest
    steps:
      - run: pnpm run lint
