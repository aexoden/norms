[project]
name = "ruff-ignores"

[tool.ruff]
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "missing-trailing-comma",
  "line-contains-todo",  # explained
  # explained above, which doesn't count
  "line-contains-fixme",
  "print",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)SPDX-FileCopyrightText: \\d{4}"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["assert", "private-member-access", "magic-value-comparison"]
"scripts/*.py" = ["print"]  # explained

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
typeCheckingMode = "recommended"
reportAny = false  # explained
reportUnusedCallResult = "none"
reportMissingTypeStubs = "error"
