# prek configuration
# Install: prek install

default_install_hook_types = ["pre-commit", "commit-msg"]
# Hooks without their own stages run only before a commit, not on its message.
default_stages = ["pre-commit"]

# The test fixtures are projects for norms to check, kept exactly as written.
exclude = "^tests/fixtures/"

# General hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-vcs-permalinks"

[[repos.hooks]]
id = "check-yaml"
# copier.yml uses Copier's !include tag across several documents.
exclude = '^copier\.yml$'

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"

# Licensing
[[repos]]
repo = "https://github.com/fsfe/reuse-tool"
rev = "v6.3.0"

[[repos.hooks]]
id = "reuse"

# Markdown
[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.24.1"

[[repos.hooks]]
id = "markdownlint-cli2"

# TOML
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.11.2"

[[repos.hooks]]
id = "tombi-format"
args = ["--check"]
# Lock files are generated, so they aren't formatted.
exclude = '(^|/)(Cargo|uv)\.lock$'

# GitHub Actions security
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.32.0"

[[repos.hooks]]
id = "zizmor"
args = ["--pedantic"]

# Conventional commits
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["feat", "fix", "perf", "refactor", "style", "test", "docs", "build", "ci", "revert", "chore"]

# norms, run from this checkout; other projects use the hooks in
# .pre-commit-hooks.yaml instead.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "norms-commit-msg"
name = "norms commit-msg"
description = "Check that a commit message's type is lowercase and its subject and body lines are within 72 characters"
entry = "cargo run --quiet --locked -- commit-msg"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "norms-verify"
name = "norms verify"
description = "Check that the project follows the norms standards"
entry = "cargo run --quiet --locked -- verify ."
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]
args = ["--deny-warnings"]

# Rust
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-lock"
name = "cargo lock"
description = "Check that Cargo.lock is up to date"
entry = "cargo update --workspace --locked"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "rustfmt"
name = "rustfmt"
description = "Format Rust code using rustfmt"
entry = "cargo fmt --all --check"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "clippy"
description = "Lint Rust code using clippy"
entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "cargo-test"
name = "cargo llvm-cov"
description = "Run Rust tests with coverage using cargo-llvm-cov"
entry = "cargo llvm-cov --workspace --all-features --show-missing-lines"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "cargo-doctest"
name = "cargo test --doc"
description = "Run Rust doctests using cargo test"
entry = "cargo test --workspace --all-features --doc"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "cargo-deny"
name = "cargo-deny"
description = "Check Rust dependency bans, licenses and sources using cargo-deny"
entry = "cargo deny --workspace --all-features check -D warnings bans licenses sources"
language = "system"
pass_filenames = false
